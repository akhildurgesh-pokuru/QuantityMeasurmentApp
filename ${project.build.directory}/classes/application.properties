
# UC17: Spring Boot application identity
spring.application.name=quantity-measurement-app

# REST API server
server.port=8080

# H2 in-memory database for UC17 development
spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate automatically creates tables for development
spring.jpa.hibernate.ddl-auto=create-drop

# Disable initialization of UC16 SQL scripts
spring.sql.init.mode=never

# Display executed SQL during learning
spring.jpa.show-sql=true

# Enable the H2 browser console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Basic development connection pool
spring.datasource.hikari.maximum-pool-size=5

# Actuator monitoring
management.endpoints.web.exposure.include=health,info

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
